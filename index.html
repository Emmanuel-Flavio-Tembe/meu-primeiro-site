<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Primeiro Site</title>
    <style>
        body {
            background-color: #000000; /* ALTRADO: Preto total estilo hacker */
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px 10px;
        }
        h1 {
            color: #39ff14; /* ALTERADO: Verde neon nos títulos */
        }
        .container-imagens {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }
        .bloco-item {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .imagem-tech {
            width: 100%;
            height: auto;
            border-radius: 16px;
            border: 4px solid #39ff14; /* ALTERADO: Borda verde neon */
            box-sizing: border-box;
        }
        .legenda-imagem {
            margin-top: 10px;
            font-size: 16px;
            color: #39ff14; /* ALTERADO: Legenda verde neon */
            font-weight: bold;
            font-style: italic;
        }
        .botao {
            display: inline-block;
            background-color: #39ff14; /* ALTERADO: Botão verde neon */
            color: #000000; /* ALTERADO: Texto do botão preto */
            padding: 12px 24px;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease; 
        }
        .botao:hover, .botao:active {
            background-color: #ffffff;
            color: #000000;
            transform: scale(1.1);
            box-shadow: 0px 0px 15px #39ff14; /* ALTERADO: Brilho verde neon */
        }
        .secao-contato {
            margin-top: 50px;
            background-color: #0d0d0d; /* ALTERADO: Fundo escuro da caixa */
            padding: 30px 20px;
            border-radius: 16px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            border: 2px solid #39ff14; /* ALTERADO: Borda da caixa verde */
            box-sizing: border-box;
        }
        .campo-formulario {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #39ff14; /* ALTERADO: Borda dos campos verde */
            background-color: #000000; /* ALTERADO: Dentro dos campos preto */
            color: #ffffff;
            box-sizing: border-box;
            font-size: 16px;
        }
        .campo-formulario::placeholder {
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="container-imagens">
        <!-- Item 1: Imagem + Legenda -->
        <div class="bloco-item">
            <img src="Screenshot_20260707-194552.jpg" alt="Imagem 1" class="imagem-tech">
            <p class="legenda-imagem">Esta é a legenda da minha primeira imagem de informática</p>
        </div>

        <!-- Item 2: Imagem + Legenda -->
        <div class="bloco-item">
            <img src="Screenshot_20260729-113449.jpg" alt="Imagem 2" class="imagem-tech">
            <p class="legenda-imagem">Esta é a legenda do meu segundo print de tela</p>
        </div>
        
        <img src="Screenshot_20260729-113449.jpg" alt="imagem 3" class="imagem-tech">
    </div>

    <h1>Olá, Mundo!</h1>
    <p>Meu nome é Emmanuel Flávio.</p>
    <p>Tenho 19 anos e sou estudante de informática!</p>
    
    <a href="https://github.com" target="_blank" class="botao">Meu GitHub</a>
    <a href="https://wa.me" target="_blank" class="botao">Fale Comigo no WhatsApp</a>

    <!-- SEÇÃO DO FORMULÁRIO DE CONTATO -->
    <div class="secao-contato">
        <h2>Envie uma Mensagem</h2>
        
        <form action="https://staticforms.xyz" method="post">
            <input type="hidden" name="accessKey" value="f7b1e4b9-8e54-41f4-abe7-eceede3e855a">
            <input type="hidden" name="redirectTo" value="https://github.io">
            
            <input type="text" name="name" class="campo-formulario" placeholder="Seu Nome" required>
            <input type="email" name="email" class="campo-formulario" placeholder="Seu E-mail" required>
            <textarea name="message" class="campo-formulario" rows="5" placeholder="Digite sua mensagem aqui..." required></textarea>
            
            <button type="submit" class="botao">Enviar Mensagem</button>
        </form>
    </div>

</body>
    </html>
