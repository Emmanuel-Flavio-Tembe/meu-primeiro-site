<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Primeiro Site</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #00d2fc;
        }
        .galeria {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .bloco-imagem {
            margin: 10px;
            background-color: #162447;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #00d2fc;
            width: 180px;
        }
        .imagem-print {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
        }
        .legenda {
            margin-top: 10px;
            font-size: 14px;
            color: #00d2fc;
            font-weight: bold;
        }
        .botao {
            display: inline-block;
            background-color: #00d2fc;
            color: #1a1a2e;
            padding: 12px 24px;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
        .botao:hover {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="galeria">
        <!-- Primeira Imagem com Legenda -->
        <figure class="bloco-imagem">
            <img src="Screenshot_20260707-194552.jpg" alt="Primeira Imagem" class="imagem-print">
            <figcaption class="legenda">Legenda 1</figcaption>
        </figure>

        <!-- Segunda Imagem com Legenda -->
        <figure class="bloco-imagem">
            <img src="arquivo_000000008e5481f4858af3db329f4083.png" alt="Segunda Imagem" class="imagem-print">
            <figcaption class="legenda">Legenda 2</figcaption>
        </figure>

        <!-- Terceira Imagem com Legenda -->
        <figure class="bloco-imagem">
            <img src="arquivo_0000000053c481f4abe7eceede3e855a.png" alt="Terceira Imagem" class="imagem-print">
            <figcaption class="legenda">Legenda 3</figcaption>
        </figure>
    </div>

    <h1>Olá, Mundo!</h1>
    <p>Meu nome é Emmanuel Flávio.</p>
    <p>Tenho 19 anos e sou estudante de informática!</p>

    <a href="https://github.com" target="_blank" class="botao">Meu GitHub</a>
    <a href="https://wa.me" target="_blank" class="botao">Fale Comigo no WhatsApp</a>
</body>
    </html>
