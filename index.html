<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDownloads - Download Seguro de Software</title>
    <!-- Tipografia Clean (Inter) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Variáveis de Design - Tema Escuro Premium */
        :root {
            --bg-principal: #0b0f19;
            --bg-card: #151b2c;
            --bg-input: #1e2640;
            --cor-destaque: #39ff14; /* Verde Neon */
            --cor-texto: #f3f4f6;
            --cor-mutado: #9ca3af;
            --borda-suave: #222d4a;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--cor-texto);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Espaçamento em Branco Global (White Space) */
        .secao {
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Cabeçalho / Navegação */
        header {
            background-color: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--borda-suave);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }

        .logo span {
            color: var(--cor-destaque);
        }

        .nav-links a {
            color: var(--cor-texto);
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--cor-destaque);
        }

        /* Filtros e Pesquisa */
        .area-pesquisa {
            background-color: var(--bg-card);
            border: 1px solid var(--borda-suave);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .input-filtro {
            background-color: var(--bg-input);
            border: 1px solid var(--borda-suave);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }

        .select-filtro {
            background-color: var(--bg-input);
            border: 1px solid var(--borda-suave);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Títulos */
        h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        h2 span {
            color: var(--cor-destaque);
        }

        /* Grelha de Cartões (Grid) */
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .card-download {
            background-color: var(--bg-card);
            border: 1px solid var(--borda-suave);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card-download:hover {
            transform: translateY(-4px);
            border-color: var(--cor-destaque);
        }

        .capa-card {
            width: 100%;
            height: 180px;
            background-color: #1e2640;
            object-fit: cover;
        }

        .conteudo-card {
            padding: 20px;
        }

        .categoria-tag {
            color: var(--cor-destaque);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .titulo-card {
            font-size: 20px;
            margin: 8px 0 15px 0;
            font-weight: 600;
        }

        /* Selo Verificado & Segurança (Anti-Burla) */
        .selo-verificado {
            background-color: rgba(57, 255, 20, 0.06);
            border: 1px solid rgba(57, 255, 20, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .selo-icone {
            color: var(--cor-destaque);
            font-weight: bold;
        }

        .link-relatorio {
            color: var(--cor-destaque);
            text-decoration: underline;
            font-weight: 500;
        }

        /* Detalhes Técnicos */
        .dados-tecnicos {
            font-size: 13px;
            color: var(--cor-mutado);
            border-top: 1px solid var(--borda-suave);
            padding-top: 15px;
            margin-top: 15px;
        }

        .hash-code {
            font-family: monospace;
            background-color: var(--bg-input);
            padding: 4px 8px;
            border-radius: 4px;
            color: #fff;
            display: block;
            margin-top: 5px;
            word-break: break-all;
        }

        /* Botão de Download Direto */
        .btn-download {
            display: block;
            width: 100%;
            background-color: var(--cor-destaque);
            color: #000;
            text-align: center;
            padding: 14px 0;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 20px;
            transition: opacity 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        /* Seção de Mídia (Trailer & Screenshots) */
        .container-media {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .trailer-box iframe {
            width: 100%;
            height: 350px;
            border-radius: 12px;
            border: 1px solid var(--borda-suave);
        }

        .screenshots-box {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .screenshot-img {
            width: 100%;
            height: 110px;
            background-color: #1e2640;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Avaliações / Comentários Reais */
        .secao-comentarios {
            background-color: var(--bg-card);
            border: 1px solid var(--borda-suave);
            border-radius: 16px;
            padding: 30px;
            margin-top: 40px;
        }

        .comentario {
            border-bottom: 1px solid var(--borda-suave);
            padding: 20px 0;
        }

        .comentario:last-child {
            border-bottom: none;
        }

        .autor-comentario {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .estrelas {
            color: gold;
        }

        .texto-comentario {
            color: var(--cor-mutado);
            font-size: 14px;
            margin-top: 5px;
        }

        /* Rodapé Legal e Páginas Institucionais */
        footer {
            background-color: #060910;
            border-top: 1px solid var(--borda-suave);
            padding: 60px 20px;
            margin-top: 100px;
            font-size: 14px;
            color: var(--cor-mutado);
        }

        .footer-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
        }

        .footer-col h4 {
            color: #fff;
            margin-bottom: 20px;
        }

        .footer-col a {
            color: var(--cor-mutado);
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }

        .footer-col a:hover {
            color: var(--cor-destaque);
        }

        /* Modal/Passos Simplificados de Download */
        .passos-instalacao {
            background-color: var(--bg-card);
            border-left: 4px solid var(--cor-destaque);
            padding: 20px;
            border-radius: 0 12px 12px 0;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .container-media { grid-template-columns: 1fr; }
            .area-pesquisa { flex-direction: column; }
        }
    </style>
</head>

        <div class="area-pesquisa">
