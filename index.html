<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Primeiro Site</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #00d2fc;
        }
        .imagem-topo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #00d2fc;
            margin-bottom: 20px;
            object-fit: cover;
        }
        .botao {
            display: inline-block;
            background-color: #00d2fc;
            color: #1a1a2e;
            padding: 12px 24px;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
        .botao:hover {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Esta é a nova tag de imagem que adicionamos -->
    <img src="https://unsplash.com" alt="Código de Programação" class="imagem-topo">

    <h1>Olá, Mundo!</h1>
    <p>Meu nome é Emmanuel Flávio.</p>
    <p>Tenho 19 anos e sou estudante de informática!</p>
    
    <br><br>
    
    <a href="https://github.com" target="_blank" class="botao">Meu GitHub</a>
    <a href="https://wa.me" target="_blank" class="botao">Fale Comigo no WhatsApp</a>
</body>
</html>
