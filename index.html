<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tecnologia e Informática | Emmanuel Flávio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: left;
        }

        /* =========================
           BARRA PRINCIPAL
        ========================= */

        .barra-topo {
            width: 100%;
            min-height: 120px;
            background: linear-gradient(135deg, #006eff, #003cff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px 15px;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 3px 15px rgba(0,0,0,0.5);
            box-shadow: 0 5px 25px rgba(0,110,255,0.45);
        }

        /* =========================
           CONTEÚDO PRINCIPAL
        ========================= */

        .conteudo {
            width: 94%;
            max-width: 1000px;
            margin: auto;
        }

        .apresentacao {
            text-align: center;
            padding: 45px 15px 30px;
        }

        .apresentacao h1 {
            color: #39ff14;
            font-size: 42px;
            line-height: 1.15;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #39ff14;
        }

        .apresentacao p {
            font-size: 24px;
            line-height: 1.5;
            color: #dddddd;
        }

        .destaque {
            color: #006eff;
            font-weight: bold;
        }

        /* =========================
           TÍTULOS
        ========================= */

        .titulo-secao {
            color: #39ff14;
            font-size: 36px;
            text-align: center;
            margin: 45px 0 25px;
            text-shadow: 0 0 12px #39ff14;
        }

        .subtitulo {
            color: #cccccc;
            text-align: center;
            font-size: 21px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* =========================
           IMAGENS
        ========================= */

        .container-imagens {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-top: 30px;
        }

        .bloco-item {
            width: 100%;
            text-align: center;
        }

        .img-tech-padrao {
            width: 100%;
            height: auto;
            display: block;
            border: 3px solid #39ff14;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(57,255,20,0.25);
        }

        .legenda-imagem {
            color: #39ff14;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }

        /* =========================
           CARTÕES DE TECNOLOGIA
        ========================= */

        .cartoes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .cartao {
            background: #0d0d0d;
            border: 1px solid #222;
            border-left: 4px solid #006eff;
            border-radius: 12px;
            padding: 25px;
            transition: 0.3s;
        }

        .cartao:hover {
            transform: translateY(-5px);
            border-color: #39ff14;
            box-shadow: 0 0 20px rgba(57,255,20,0.15);
        }

        .cartao h3 {
            color: #39ff14;
            font-size: 25px;
            margin-top: 0;
        }

        .cartao p {
            color: #cccccc;
            font-size: 18px;
            line-height: 1.6;
        }

        /* =========================
           ÁREA DE GANHAR DINHEIRO
        ========================= */

        .dinheiro {
            background: linear-gradient(145deg, #0b0b0b, #101820);
            border: 2px solid #006eff;
            border-radius: 16px;
            padding: 35px 25px;
            margin-top: 45px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0,110,255,0.15);
        }

        .dinheiro h2 {
            color: #39ff14;
            font-size: 34px;
        }

        .dinheiro p {
            color: #dddddd;
            font-size: 20px;
            line-height: 1.6;
        }

        .lista-dinheiro {
            text-align: left;
            max-width: 700px;
            margin: 25px auto;
            padding: 0;
            list-style: none;
        }

        .lista-dinheiro li {
            font-size: 19px;
            color: #eeeeee;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }

        /* =========================
           ANÚNCIOS
        ========================= */

        .area-anuncio {
            text-align: center;
            margin: 40px 0;
        }

        .area-anuncio h2 {
            color: #39ff14;
            font-size: 30px;
        }

        .mensagem-anuncio {
            background: #0d0d0d;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
            border: 1px solid #222;
        }

        .mensagem-anuncio p {
            color: #dddddd;
            font-size: 19px;
            line-height: 1.6;
        }

        .mensagem-anuncio strong {
            color: #39ff14;
        }

        .banner-disfarçado {
            display: inline-block;
            margin: 25px auto;
            width: 100%;
        }

        .anuncio-led-retangular {
            width: 850px;
            height: 1000px;
            max-width: 95%;
            border-radius: 12px;
            object-fit: cover;
            border: 5px solid #39ff14;
            animation: efeitoLed 1.2s infinite alternate ease-in-out;
        }

        @keyframes efeitoLed {

            0% {
                box-shadow: 0 0 15px #39ff14;
            }

            100% {
                box-shadow: 0 0 35px #39ff14;
            }
        }

        /* =========================
           BOTÕES
        ========================= */

        .botao {
            display: inline-block;
            background: #39ff14;
            color: #000000;
            padding: 15px 25px;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .botao:hover {
            background: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 0 20px #39ff14;
        }

        /* =========================
           MENSAGEM SOBRE ANÚNCIOS
        ========================= */

        .convite-anuncio {
            background: #0b0b0b;
            border: 2px solid #39ff14;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            margin: 40px 0;
        }

        .convite-anuncio h2 {
            color: #39ff14;
            font-size: 30px;
        }

        .convite-anuncio p {
            color: #dddddd;
            font-size: 19px;
            line-height: 1.6;
        }

        /* =========================
           DICA DE INFORMÁTICA
        ========================= */

        .caixa-dica {
            background: #0d0d0d;
            border-left: 5px solid #006eff;
            padding: 25px;
            margin: 40px 0;
            border-radius: 10px;
        }

        .caixa-dica h2 {
            color: #39ff14;
        }

        .caixa-dica p {
            color: #dddddd;
            font-size: 19px;
            line-height: 1.6;
        }

        /* =========================
           FORMULÁRIO
        ========================= */

        .secao-contato {
            background: #0d0d0d;
            padding: 35px 25px;
            margin: 50px auto;
            border: 2px solid #39ff14;
            border-radius: 16px;
            max-width: 750px;
        }

        .secao-contato h2 {
            color: #39ff14;
            text-align: center;
            font-size: 32px;
        }

        .secao-contato p {
            text-align: center;
            color: #cccccc;
            font-size: 18px;
            line-height: 1.5;
        }

        .campo-formulario {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #000000;
            color: #ffffff;
            font-size: 18px;
            outline: none;
        }

        .campo-formulario:focus {
            border-color: #39ff14;
            box-shadow: 0 0 10px rgba(57,255,20,0.2);
        }

        textarea.campo-formulario {
            min-height: 160px;
            resize: vertical;
        }

        .botao-enviar {
            width: 100%;
            padding: 17px;
            background: #39ff14;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao-enviar:hover {
            background: #ffffff;
        }

        /* =========================
           RODAPÉ
        ========================= */

        footer {
            background: #020202;
            border-top: 1px solid #222;
            text-align: center;
            padding: 35px 15px;
            margin-top: 50px;
        }

        footer p {
            color: #888888;
            font-size: 16px;
        }

        /* =========================
           TELEMÓVEL
        ========================= */

        @media (max-width: 700px) {

            .barra-topo {
                min-height: 110px;
                font-size: 32px;
            }

            .apresentacao h1 {
                font-size: 32px;
            }

            .apresentacao p {
                font-size: 20px;
            }

            .titulo-secao {
                font-size: 30px;
            }

            .cartoes {
                grid-template-columns: 1fr;
            }

            .cartao p,
            .dinheiro p,
            .lista-dinheiro li {
                font-size: 18px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         BARRA AZUL
    ========================= -->

    <div class="barra-topo">
        TECNOLOGIA E INFORMÁTICA
    </div>
