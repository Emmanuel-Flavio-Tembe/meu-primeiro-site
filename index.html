<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Primeiro Site</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px 10px;
        }
        h1 {
            color: #00d2fc;
        }
        .container-imagens {
            display: flex;
            justify-content: center;
            flex-direction: column; /* Puts images on top of each other for maximum width */
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .imagem-tech {
            width: 100%; /* Takes up 100% of the available width */
            max-width: 500px; /* Limits size on computers so it doesn't get distorted */
            height: auto; /* Automatically adjusts height so the photo doesn't look stretched */
            border-radius: 16px;
            border: 4px solid #00d2fc;
            box-sizing: border-box;
        }
        .botao {
            display: inline-block;
            background-color: #00d2fc;
            color: #1a1a2e;
            padding: 12px 24px;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
        .botao:hover {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container-imagens">
        <img src="Screenshot_20260707-194552.jpg" alt="Imagem 1" class="imagem-tech">
        <img src="Screenshot_20260729-113449.jpg" alt="Imagem 2" class="imagem-tech">
    </div>

    <h1>Olá, Mundo!</h1>
    <p>Meu nome é Emmanuel Flávio.</p>
    <p>Tenho 19 anos e sou estudante de informática!</p>
    
    <br><br>
    
    <a href="https://github.com" target="_blank" class="botao">Meu GitHub</a>
    <a href="https://wa.me" target="_blank" class="botao">Fale Comigo no WhatsApp</a>
</body>
</html>
